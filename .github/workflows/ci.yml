name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://invoicing:invoicing@localhost:5432/invoicing
      HERMES_URL: redis://localhost:6379
      NODE_ENV: test
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: invoicing, POSTGRES_PASSWORD: invoicing, POSTGRES_DB: invoicing }
        ports: ["5432:5432"]
      redis:
        image: redis:7
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
